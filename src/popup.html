<!DOCTYPE html>
<head>
    <link rel="stylesheet" href="popup.css">
    <script src='popup.js'></script>
</head>
<body>
    <div class="popup">
        <header class="popup__header">
            <div class="brand">
                <div class="brand__title">TikTok Download Buttons</div>
                <div id="version"></div>
            </div>
            <a href="#" id="website" target="_blank">Website</a>
        </header>

        <main class="popup__content">
            <section class="card">
                <div class="card__header">
                    <h3>Subfolder</h3>
                </div>
                <p class="help">Subfolder to download videos to. Leaving it empty will download videos to your default directory.</p>
                <input type="text" spellcheck="false" id="download-subfolder-path" placeholder="Subfolder path ...">
            </section>

            <section class="card">
                <div class="card__header">
                    <h3>Naming</h3>
                </div>
                <p class="help">Naming template to use when saving videos. Some placeholders require API data, but we’ll fill what we can from the page too. See <a class="link" target="_blank" href="https://github.com/sixem/tiktok-download-buttons/blob/main/TEMPLATE.md">templating</a>.</p>
                <input type="text" spellcheck="false" id="download-naming-template" placeholder="{uploader} - {id}">
            </section>
        </main>

        <footer class="popup__footer">
            <button id="settings-save">Save settings</button>
        </footer>
    </div>
</body>
</html>
